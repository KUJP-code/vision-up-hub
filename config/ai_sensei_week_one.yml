# Guide timecodes use HH:MM:SS:FF. Vimeo streams at 24 fps.
fps: 24
splash: w1-splash.jpg
splash_alt: あいさつをするキャラクターたち
description: あいさつのことばを聞いて、みんなで楽しく英語を話してみましょう。
phrases: Hello! / Nice to meet you! / See you!
vocabulary: Hello / friends / goodbye
flashcards: [Hello!, Nice to meet you!, See you!]
lessons:
  story-1:
    title: The Runaway Balloon（にげだしたふうせん）
    video: https://player.vimeo.com/external/1225145089.m3u8?s=182f1f053af84f2f1c03c0db77b8fb08e335e690&logging=false
    subtitle_asset: subtitles/story.en.vtt
    objective: |-
      Jot（ジョット）が公園で見つけた風船を追いかける中で、Echo（エコー）、Boom（ブーム）、Tale（テイル）と出会う物語です。
      キャラクター同士の出会いを通して、英語でのあいさつや自己紹介の表現に親しみます。物語に合わせたTPRアクションで、体を動かしながら英語を学びます。

      メインターゲット表現
      ・Hello!（こんにちは！）
      ・I'm ○○.（私は○○です）
      ・Nice to meet you!（はじめまして！）
      ・Nice to meet you, too!（こちらこそ、はじめまして！）
      ・See you!（またね！）
    materials: 教材の準備はいりません。
    tip: 動画の呼びかけに合わせて動いたり、あいさつをしたりしましょう。手を伸ばす場面では両足を床につけたまま行います。
    chapters:
      - start: '00:00:00:00'
        end: '00:00:47:00'
        title: 公園で風船を発見
        guide: |-
          Jotが公園を歩いていると、空に浮かぶ風船を見つけます。ナレーターの呼びかけに合わせて、上を見たり、風船を指さしたりします。

          TPRアクション
          ・Look up：顔を上に向け、空を見上げましょう。
          ・Point to the balloon：画面の風船を見つけ、指をさしましょう。
      - start: '00:00:47:00'
        end: '00:01:30:00'
        title: 風船を追いかけよう
        guide: |-
          風に飛ばされた風船をJotが追いかけます。子どもたちもJotと一緒に、その場で足踏みをしながら風船を追いかけます。続いて、画面に現れる風船を探します。

          TPRアクション
          ・March：「March! March! March!」の掛け声に合わせて、その場で足踏みをしましょう。
          ・Point：「Point to the balloon.」の合図で、画面の風船を見つけて指をさしましょう。
      - start: '00:01:30:00'
        end: '00:02:10:00'
        title: Echoとの出会い
        guide: |-
          風船を追いかけていたJotは、Echoと出会います。初めて会った2人は、「Hello!」「I'm ○○.」「Nice to meet you!」を使ってあいさつと自己紹介をします。
          風船が再び飛んでいき、2人は一緒に追いかけることにします。

          TPRアクション
          ・Wave hello：「Let's wave hello to Echo.」の合図に合わせて、Echoに向かって手を振りましょう。
      - start: '00:02:10:00'
        end: '00:02:41:00'
        title: Boomとの出会い
        guide: |-
          飛んできた風船がBoomの頭に乗り、JotとEchoはBoomに出会います。3人は自己紹介をし、「Nice to meet you!」とあいさつを交わします。
          Boomも加わり、3人で風船を追いかけることになります。

          参加ポイント
          新しいキャラクターが登場するたびに繰り返される「Hello!」「Nice to meet you!」に注目しましょう。この場面には、特定のTPR指示はありません。
      - start: '00:02:41:00'
        end: '00:03:26:00'
        title: 風船はどこ？
        guide: |-
          3人は風船を見失ってしまいます。Echoが音を聞くように促し、みんなで静かに耳を澄ませます。地面や茂みの中を探した後、木の上に引っかかっている風船を発見します。

          TPRアクション
          ・Listen：「Put your hand by your ear.」の合図で、片手を耳に当て、静かに音を聞きましょう。
          ・Look down：「Is it on the ground?」に合わせて、下を見ましょう。
          ・Look for the balloon：「Is it in the bushes?」に合わせて、両手で双眼鏡を作るようにして前方を探しましょう。
          ・Look up：「Look up!」の合図で上を見て、風船を探しましょう。
      - start: '00:03:26:00'
        end: '00:04:07:00'
        title: Taleとの出会い
        guide: |-
          風船が引っかかっている木のそばで、Taleと出会います。Jot、Echo、Boom、Taleは自己紹介をし、あいさつを交わします。
          Boomが風船を取ろうとしますが、高くて手が届きません。子どもたちも一緒に手を伸ばして手伝います。

          TPRアクション
          ・Reach up high：「Stay in your place and reach up high.」に合わせて、両手を上に伸ばしましょう。
          ・A little higher：「A little higher!」の合図で、さらに高く手を伸ばしましょう。
          安全のため、ジャンプをせず、両足を床につけたまま行います。
      - start: '00:04:07:00'
        end: '00:05:19:00'
        title: みんなで風船を取ろう
        guide: |-
          4人は協力して風船を取る方法を考えます。キャラクターたちは肩に乗り合って高い場所にある風船に手を伸ばし、ついに風船を取ることに成功します。
          子どもたちも応援の言葉をかけ、成功したら一緒に喜びます。

          TPRアクション
          ・Cheer：「Everyone, say 'You can do it!'」の呼びかけに合わせて、「You can do it!」と言って応援しましょう。
          ・Celebrate：「Put your hands up and say hooray!」の合図で、両手を上げながら「Hooray!」と言いましょう。
      - start: '00:05:19:00'
        end: '00:06:00:00'
        title: 風船からのメッセージ
        guide: |-
          風船に小さなカードがついていることに気づきます。カードには「Hello, new friends!」と書かれていました。風船をきっかけに出会った4人は、新しい友達になったことを喜び、お互いにあいさつをします。

          参加ポイント
          4人が順番に「Hello!」とあいさつする様子に注目しましょう。この場面には、特定のTPR指示はありません。
      - start: '00:06:00:00'
        end: '00:06:43:00'
        title: また会おうね
        guide: |-
          夕方になり、4人は家に帰る時間になります。お互いに「See you!」とあいさつをして別れます。子どもたちもキャラクターに向かって手を振り、一緒に別れのあいさつをします。

          TPRアクション
          ・Wave goodbye：「Wave to your new friends.」の合図で、キャラクターたちに向かって手を振りましょう。
          ・Say goodbye：「Can you say it, too?」に合わせて、一緒に「See you!」と言いましょう。
      - start: '00:06:43:00'
        end: '00:06:58:00'
        title: 風船の次の冒険
        guide: |-
          誰もいなくなった公園で、風船が再び飛んでいきます。ナレーターが風船の行き先を問いかけ、次の新しい友達との出会いを予感させながら物語が終わります。

          参加ポイント
          風船がどこへ向かうのかを想像しながら、物語の最後を楽しみましょう。この場面には、特定のTPR指示はありません。
      - start: '00:06:58:00'
        end: '00:08:03:00'
        title: キャラクタークイズ
        guide: |-
          開始時刻は推定です。物語に登場したキャラクターと風船を使った復習クイズを行います。画面を見て、名前を英語で答えましょう。

          1. Who is this? → Echo
          2. Who is this? → Tale
          3. Who is this? → Boom
          4. Who is this? → Jot
          5. What is this? → The balloon

          質問の後に解答時間があります。答えが発表される前に英語で答えてみましょう。最後に「Great job, boys and girls!」「Bye-bye!」のあいさつでレッスンを終了します。
  story-2:
    title: The Playground Hello Hunt
    video: https://player.vimeo.com/external/1247526401.m3u8?s=26cb44df329ef7b69abd23ab2050f6b56dbbc751&logging=false
    subtitle_asset: subtitles/story-2.en.vtt
    objective: |-
      Jot（ジョット）が公園で見つけた地図を手がかりに、Echo（エコー）、Boom（ブーム）、Tale（テイル）と出会う物語です。赤い丸、青い星、黄色い四角のヒントをたどりながら、新しい友達とあいさつや自己紹介をします。
      最後には、4人で協力して魔法のFriendship Circleを開きます。物語を通して英語の表現に親しみ、指さしや足踏み、ジャンプなどのTPRアクションを楽しみます。

      メインターゲット表現
      ・Hello!（こんにちは！）
      ・I'm ○○.（私は○○です）
      ・Nice to meet you!（はじめまして！）
      ・Nice to meet you, too!（こちらこそ、はじめまして！）
      ・See you!（またね！）
    materials: 教材の準備はいりません。
    tip: ヒントが出たら、子どもたちが絵を指さしたり答えたりする時間を取りましょう。体を動かすときは周りとの間隔を確保してください。
    chapters:
      - start: '00:00:00:00'
        end: '00:00:44:00'
        title: 公園で地図を発見
        guide: |-
          Jotが公園にやってくると、不思議な地図を見つけます。ナレーターの呼びかけに合わせて、画面にある地図を探します。

          TPRアクション
          ・Look and Point：「Everyone, look at the map!」「Can you point to it?」の合図で、画面の地図を見つけて指をさしましょう。
      - start: '00:00:44:00'
        end: '00:01:25:00'
        title: 赤い丸のヒント
        guide: |-
          地図に描かれた最初のヒントは、赤い丸です。Jotが公園の中を探すと、赤い滑り台を発見します。子どもたちも滑り台を探して指をさし、その場で足踏みをしながらJotと一緒に向かいます。

          TPRアクション
          ・Point：「Point to the red slide!」の合図で、画面の赤い滑り台を指さしましょう。
          ・March：「Now march with me!」「March, march, march!」に合わせて、その場で元気よく足踏みをしましょう。
      - start: '00:01:25:00'
        end: '00:02:04:00'
        title: Echoとの出会い
        guide: |-
          赤い滑り台のそばで、JotはEchoと出会います。2人は「Hello!」「I'm ○○.」「Nice to meet you!」を使って、あいさつと自己紹介をします。
          Echoが青い星のシールを見つけたと伝えると、Jotは次のヒントだと気づきます。

          TPRアクション
          ・Wave Hello：「Wave hello to Echo!」の合図に合わせて、Echoに向かって手を振りましょう。
      - start: '00:02:04:00'
        end: '00:02:29:00'
        title: 青い星のヒント
        guide: |-
          次のヒントは、青い星と2つのブランコです。JotとEchoは公園の中から青いブランコを探します。子どもたちも画面をよく見て、ブランコを見つけましょう。

          TPRアクション
          ・Look and Point：「Look carefully.」「Point to the blue swings!」の合図で、画面の中から青いブランコを探して指をさしましょう。
      - start: '00:02:29:00'
        end: '00:03:13:00'
        title: Boomとの出会い
        guide: |-
          青いブランコのそばで、JotとEchoはBoomと出会います。3人は「Hello!」「I'm ○○.」「Nice to meet you!」を使って、あいさつと自己紹介をします。
          BoomはJotたちのゲームに興味を持ち、自分が見つけた黄色い四角のシールを見せます。

          TPRアクション
          ・Clap：「Clap for the new clue!」の合図に合わせて、新しいヒントを見つけたことを拍手でお祝いしましょう。
      - start: '00:03:13:00'
        end: '00:03:47:00'
        title: 黄色い四角のヒント
        guide: |-
          3人は黄色い四角のヒントを手がかりに、公園の中を探します。滑り台やブランコを確認した後、黄色い砂場を発見します。子どもたちも立ち上がって砂場を探しましょう。

          TPRアクション
          ・Stand Up：「Stand up and look.」の合図で立ち上がり、画面をよく見ましょう。
          ・Point：「Point to the yellow sandbox!」の合図で、黄色い砂場を指さしましょう。
      - start: '00:03:47:00'
        end: '00:04:14:00'
        title: Taleとの出会い
        guide: |-
          黄色い砂場で、JotたちはTaleと出会います。4人は「Hello!」「I'm ○○.」「Nice to meet you!」を使って、あいさつと自己紹介をします。
          Taleが最後のヒントである虹色の丸を見せると、みんなで公園の中から探します。

          TPRアクション
          ・Sit Down：「Sit and look around the playground.」の合図で座りましょう。
          ・Look Around：「Can you see a rainbow circle?」の問いかけに合わせて、画面の中から虹色の丸を探しましょう。
      - start: '00:04:14:00'
        end: '00:05:03:00'
        title: 魔法のFriendship Circle
        guide: |-
          4人は公園の中央にある魔法のFriendship Circleを発見します。Friendship Circleは眠っていて、まだ光っていません。
          子どもたちも一緒に3つのアクションを行います。すべてのアクションが成功すると、Friendship Circleが光り始めます。

          TPRアクション
          ・Jump：「Jump one time!」の合図で、1回ジャンプしましょう。
          ・Stomp：「Now stomp two times!」の合図で、その場で床を2回踏み鳴らしましょう。
          ・Thumbs Up：「Now give a thumbs up!」の合図で、親指を立ててサムズアップのポーズをしましょう。
          周囲の子どもとぶつからないよう、十分なスペースを確保して行いましょう。
      - start: '00:05:03:00'
        end: '00:05:44:00'
        title: 4人の新しい友達
        guide: |-
          Friendship Circleの中に、Jot、Echo、Boom、Taleを表す4つの光る星が現れます。4人はヒントをすべて見つけ、Friendship Circleを開くことができたことを喜びます。

          TPRアクション
          ・Wave Hello：「Wave hello to the four new friends!」の合図で、4人のキャラクターに向かって手を振りましょう。
          ・Clap：「Now clap for our new friendship!」の合図で、拍手で新しい友情をお祝いしましょう。
      - start: '00:05:44:00'
        end: '00:06:16:00'
        title: また会おうね
        guide: |-
          公園のベルが鳴り、家に帰る時間になります。Jot、Echo、Boom、Taleはお互いに「See you!」と言って、別れのあいさつをします。
          最後にJotが地図の裏を見る演出があり、次の冒険を予感させながら物語が終わります。

          TPRアクション
          ・Wave Goodbye：「Wave to your friends and say 'See you!'」の合図に合わせて、手を振りながら「See you!」と言いましょう。
      - start: '00:06:16:00'
        end: '00:07:18:00'
        title: ヒントとキャラクターのクイズ
        guide: |-
          物語に登場した図形とキャラクターを使った復習クイズを行います。画面に表示される絵を見て、図形やキャラクターの名前を英語で答えましょう。

          1. What is this?（これは何かな？）→ Star（星）
          2. What is this?（これは何かな？）→ Square（四角）
          3. What is this?（これは何かな？）→ Circle（丸）
          4. Who is this?（これは誰かな？）→ Tale
          5. Who is this?（これは誰かな？）→ Jot

          質問の後に解答時間があります。答えが発表される前に英語で答えてみましょう。最後に「Great job, boys and girls!」「Bye-bye!」のあいさつでレッスンを終了します。
  story-3:
    title: Monsters on the Move
    video: https://player.vimeo.com/external/1247889122.m3u8?s=e9605fd1c935a72f73d62f7c0cb456bcb9b8be8d&logging=false
  basic:
    title: みんなであいさつしよう！
    subtitle_asset: subtitles/basic.en.vtt
    video: https://player.vimeo.com/external/1225143839.m3u8?s=11fe9dcb7779be20830d9059c8f5cbd8ec478453&logging=false
    objective: Hello / Nice to meet you / See you の３つのあいさつを、場面に合わせて使ってみましょう。
    materials: 教材の準備はいりません。立って体を動かせるスペースを確保しましょう。
    tip: 先生が先にお手本を見せてから、子どもたちの返事を待ちましょう。声やジェスチャーで答えられたら、たくさんほめましょう。
    chapters:
      - start: '00:00:00:07'
        end: '00:00:34:00'
        title: オープニング
        guide: Jotが「I'm Jot. Nice to meet you.」と挨拶・自己紹介をします。「お友だちへのあいさつの仕方」を学びます。
      - start: '00:00:34:00'
        end: '00:03:53:00'
        title: 今週のフレーズ、ワードを確認
        guide: |-
          お手本を見てリピートします。
          「Hello」：誰かに会った時の言葉
          「Nice to meet you」：新しいお友だちに会ったときの言葉
          「See you」：別れ際に言う言葉
      - start: '00:03:53:00'
        end: '00:06:15:00'
        title: 単語・表現チェッククイズ
        guide: |-
          2択クイズと記憶ゲームで理解度を確認します。

          シチュエーションクイズ（00:03:49:13 – 00:05:10:15）
          Tailからの2択問題（3問）。
          1. Jotが教室に入ってきたとき（Hello か See you。正解：Hello）
          2. Echoが新しいお友だちに会ったとき（See you か Nice to meet you。正解：Nice to meet you）
          3. Boomがおうちに帰るとき（See you か Hello。正解：See you）

          「だれが消えたかな？」記憶ゲーム（00:05:10:17 – 00:06:21:06）
          消えたキャラクターを当て、場面に合った挨拶をします。Boomが再登場したら「Hello」、Echoが退出したら「See you」が正解です。
      - start: '00:06:15:00'
        end: '00:08:04:00'
        title: 体を動かすアクティビティ
        guide: |-
          立ち上がり、英語フレーズと動きを連動させて定着させます。
          「Hello」手を振る：通常の手振りと全身で「ビッグ・ハロー」。
          「Nice to meet you」エアー握手：手を差し出してやさしく握手。
          「See you」一歩下がってバイバイ：後ろに一歩下がりながら手振り。
      - start: '00:08:04:00'
        end: '00:08:56:00'
        title: ふりかえりクイズ
        guide: |-
          選択肢なしで即座にあいさつを言えるか確認します。
          1. Jotがお友だちに会ったとき「Hello」
          2. Boomに新しいお友だちができたとき「Nice to meet you」
          3. Tailがおうちに帰るとき「See you」
      - start: '00:08:56:00'
        end: '00:09:20:03'
        title: さいごに
        guide: 子どもたちの頑張りを褒めます。「帰る時間の言葉」を問いかけ、全員で手を振り「See you!」で終了します。
  activity-1:
    title: あいさつの工作
    worksheet: worksheets/w1-cut-and-paste.pdf
    subtitle_asset: subtitles/activity-1.en.vtt
    category: 工作
    description: Jot、Echo、Helloのパーツを切って貼り、あいさつの作品を作りましょう。
    video: https://player.vimeo.com/external/1225144025.m3u8?s=60ed890e2bcfe86b6108771b13c05d76388318a0&logging=false
    objective: 工作を通してキャラクターの名前と「Hello」を確認し、声に出してあいさつしましょう。
    materials: ワークシート、はさみ、のりを用意しましょう。
    tip: 貼る場所の確認・切る作業・貼る作業の後に動画が一時停止します。全員の進み具合を確認してから再生しましょう。はさみを使うときは手元を見守ります。
    chapters:
      - start: '00:00:00:07'
        end: '00:00:21:11'
        title: イントロ
        guide: Echoがあいさつをし、これから工作を始めることを伝えています。
      - start: '00:00:20:00'
        end: '00:01:41:20'
        title: 使うものの紹介
        guide: |-
          工作で使うものを確認します。
          ・Scissors / はさみ
          ・Glue / のり
          ・Paper / 紙

          ワークシートに描かれているキャラクター・単語を一緒に確認します。
          ・Jot
          ・Echo
          ・HELLO!
      - start: '00:01:41:22'
        end: '00:02:17:01'
        title: アクティビティの手順 · 貼る場所の確認
        guide: |-
          アクティビティの手順（00:01:41:22 – 00:03:22:10）
          切り取ったパーツをどこに置くかを事前に確認します。
        pause_after: true
      - start: '00:02:17:03'
        end: '00:02:47:00'
        title: 切る作業
        guide: |-
          キャラクターや単語を順番にハサミで切り取ります。
          ・Cut out / 切り抜く
        pause_after: true
      - start: '00:02:47:01'
        end: '00:03:22:10'
        title: 貼る作業
        guide: |-
          のりをつけて1つずつ貼っていきます。
          ・Put glue on ○○ / ○○にのりをつけてね。
          ・Stick ○○ here / ○○をここに貼ってね。
        pause_after: true
      - start: '00:03:22:12'
        end: '00:03:58:12'
        title: おさらい
        guide: クイズ形式で理解度を確認します。キャラクターの名前や「Hello!」を問いかけ、発話を促します。
  activity-2:
    title: なまえをなぞって色ぬり
    worksheet: worksheets/w1-name-trace.pdf
    subtitle_asset: subtitles/activity-2.en.vtt
    category: ぬりえ
    description: 自分の名前をなぞって好きな色でぬり、作品を見せながら自己紹介しましょう。
    video: https://player.vimeo.com/external/1225144026.m3u8?s=19c3f10e7d44865e728639377e81f7a33f5c74e3&logging=false
    # This guide counts up to frame 29.
    timecode_fps: 30
    objective: 自分の名前をなぞって色をぬり、「Hello. I'm [名前].」で自己紹介しましょう。
    materials: 名前のワークシート、えんぴつ、クレヨンを用意しましょう。
    tip: 名前をなぞるときはゆっくり進めましょう。必要に応じて一時停止し、色ぬりや自己紹介の時間を十分につくります。
    chapters:
      - start: '00:00:00:00'
        end: '00:00:20:05'
        title: イントロ
        guide: Jotがあいさつをし、今日のアクティビティでは自分の名前を書く練習をすることを伝えます。「Let's trace.」「Let's color.」と声をかけ、名前をなぞることと色を塗ることを紹介します。
      - start: '00:00:22:29'
        end: '00:01:07:08'
        title: 使うものの紹介
        guide: |-
          アクティビティで使うものと、関連する単語を確認します。
          ・Paper / 紙
          ・Pencil / 鉛筆
          ・Crayons / クレヨン
          ・Name / 名前

          Jotが自分の名前を書いた紙を見せ、名前をなぞる練習を紹介します。
          ・My name / 私の名前
          ・Trace / なぞる
      - start: '00:01:14:27'
        end: '00:03:36:20'
        title: アクティビティの手順
        guide: |-
          自分の名前をなぞる
          Jotがお手本を見せた後、自分の紙と鉛筆を用意します。自分の名前を見つけて指で指し、文字をゆっくりとなぞります。
          ・Take your paper / 紙を持ってね。
          ・Take your pencil / 鉛筆を持ってね。
          ・Find your name / 自分の名前を見つけてね。
          ・Point to your name / 自分の名前を指さしてね。
          ・Trace your name / 自分の名前をなぞってね。
          ・Slowly / ゆっくり。

          名前に色を塗る
          なぞり終わったら、自分の名前に好きな色を塗ります。Jotが色の例を紹介し、自由に好きな色を選ぶよう促します。
          ・Color your name / 自分の名前に色を塗ってね。
          ・Red / 赤
          ・Blue / 青
          ・Yellow / 黄色

          完成
          完成したら、自分の名前を見せて指さします。「Hello, I'm ...」というフレーズを使って、自分の名前を英語で発表する練習をします。
          ・Show your name / 自分の名前を見せてね。
          ・Point to your name / 自分の名前を指さしてね。
          ・Hello, I'm ... / こんにちは、私は〇〇です。
      - start: '00:03:38:00'
        end: '00:04:18:02'
        title: おさらい
        guide: |-
          クイズ形式で、今回のアクティビティで行ったことを振り返ります。

          What is this?（00:03:38:00 – 00:03:50:11）
          自分の名前を指して、何であるかを答えます。答え：My name.

          Did we trace?（00:03:53:08 – 00:04:05:01）
          名前をなぞったかどうかを確認します。答え：Yes. We traced.

          Did we color?（00:04:06:06 – 00:04:18:02）
          名前に色を塗ったかどうかを確認します。答え：Yes. We colored.

          最後に「What do we say?」と問いかけ、「Hello, I'm ...」のフレーズをもう一度練習します。
      - start: '00:04:15:20'
        end: '00:04:19:04'
        title: おわりのあいさつ
        guide: Jotが子どもたちの頑張りを褒め、終了します。
  activity-3:
    title: Helloの点つなぎ
    subtitle_asset: subtitles/activity-3.en.vtt
    category: 脳トレ
    description: １から６までの数字を順につなぎ、Helloの文字を完成させましょう。
    video: https://player.vimeo.com/external/1225144027.m3u8?s=7f8bb660ffbff5cac412806c9c59fe812954df4f&logging=false
    objective: １〜６の数字を数えながら点をつなぎ、「Hello」の文字とあいさつの表現を確認しましょう。
    materials: 点つなぎのワークシート、えんぴつを用意しましょう。
    tip: 数字を順に指さしてから線を引くと取り組みやすくなります。必要に応じて一時停止し、子どもたちのペースに合わせて進めましょう。
    chapters:
      - start: '00:00:00:00'
        end: '00:00:31:00'
        title: イントロ
        guide: Echoがあいさつをし、自分の名前を覚えているか問いかけます。「Hello!」と一緒にあいさつをした後、今回のアクティビティでは「Hello」を書く練習をすることを伝えます。
      - start: '00:00:31:00'
        end: '00:01:14:07'
        title: 使うものの紹介
        guide: |-
          アクティビティで使うものを確認します。
          ・Pencil / 鉛筆
          ・Worksheet / ワークシート

          先生に必要なものをお願いする練習をします。
          ・Pencil, please. / 鉛筆をください。
          ・Worksheet, please. / ワークシートをください。
      - start: '00:01:21:00'
        end: '00:02:12:00'
        title: ワークシートの確認
        guide: |-
          ワークシートに描かれている星や数字を確認します。
          ・Star / 星
          ・Number 1–6 / 数字の1～6
          Echoと一緒に1から6まで数え、数字の順番を確認します。
      - start: '00:02:12:00'
        end: '00:04:21:13'
        title: アクティビティの手順
        guide: |-
          数字をつなぐ練習（00:02:12:00 – 00:02:41:00）
          Echoがお手本を見せながら、数字の1と2、続いて3を見つけて線でつなぎます。
          ・Find number one / 1を見つけてね。
          ・Find number two / 2を見つけてね。
          ・Draw a line / 線を引いてね。

          自分で数字をつなぐ（00:02:41:00 – 00:03:51:22）
          子どもたちが自分でワークシートに取り組みます。1から6までの数字を順番に見つけ、線をつないでいきます。
          ・Now it's your turn / 今度はみんなの番だよ。
          ・Find one / 1を見つけてね。
          ・Find two / 2を見つけてね。
          ・Number three / 3だよ。
          ・Number four / 4だよ。
          ・Number five / 5だよ。
          ・Number six / 6だよ。

          完成した単語の確認（00:03:51:23 – 00:04:05:05）
          Echoと一緒に1から6まで数えます。線をつなぐと「HELLO」という単語が完成することを確認し、みんなで「Hello!」と発音します。
          ・Let's count together / 一緒に数えよう。
      - start: '00:04:05:05'
        end: '00:05:43:00'
        title: 英語表現の練習とおさらい
        guide: |-
          完成した「HELLO」を使って、3つのあいさつ表現を練習します。Echoの後に続いて、みんなで発音します。
          ・Hello. / こんにちは。
          ・Nice to meet you. / はじめまして。
          ・See you. / またね。
          最後に3つの表現をもう一度順番に練習します。

          数字の確認（00:05:21:08 – 00:05:30:25）
          1から6まで順番に数えます。

          単語の確認（00:05:31:12 – 00:05:43:00）
          「What is this?」と問いかけ、完成した単語を答えます。答え：Hello!
      - start: '00:05:43:00'
        end: '00:05:51:20'
        title: おわりのあいさつ
        guide: Echoが子どもたちの頑張りを褒め、今日のアクティビティを終了します。「Bye bye! See you!」とあいさつをして終わります。
