# Guide timecodes use HH:MM:SS:FF. Vimeo streams at 24 fps.
fps: 24
splash: w1-splash.jpg
splash_alt: あいさつをするキャラクターたち
description: あいさつのことばを聞いて、みんなで楽しく英語を話してみましょう。
phrases: Hello! / Nice to meet you! / See you!
vocabulary: Hello / friends / goodbye
flashcards: [Hello!, Nice to meet you!, See you!]
lessons:
  story-1:
    title: にげだしたふうせん
    video: https://player.vimeo.com/external/1225145089.m3u8?s=182f1f053af84f2f1c03c0db77b8fb08e335e690&logging=false
    subtitle_asset: subtitles/story.en.vtt
    objective: 登場人物といっしょに、英語のお話を楽しみましょう。
    materials: 教材の準備はいりません。
    tip: 一時停止しながら、子どもたちが気づいたことを聞いてみましょう。
    chapters:
      - { start: '00:00:00:00', end: '00:02:00:00', title: お話のはじまり, guide: 絵を見て、どんなお話か想像してみましょう。登場人物を指さして、注目を集めます。 }
      - { start: '00:02:00:00', end: '00:03:00:00', title: だれが出てきたかな？, guide: ここまでに登場したキャラクターを確認しましょう。子どもたちが気づいたことを聞いてみます。 }
      - { start: '00:03:00:00', end: '00:05:00:00', title: 次はどうなる？, guide: 動画を一時停止し、次に何が起こるか予想してみましょう。短い言葉やジェスチャーで答えてもらいます。 }
      - { start: '00:05:00:00', end: '00:06:00:00', title: 気持ちを考えよう, guide: 登場人物はどんな気持ちかな？表情をまねして、みんなで考えてみましょう。 }
      - { start: '00:06:00:00', title: お話を楽しもう, guide: お話の続きを見ましょう。最後に、好きだった場面を一つ教えてもらいます。 }
  story-2:
    title: The Hello Hunt
    video: https://player.vimeo.com/external/1247526401.m3u8?s=26cb44df329ef7b69abd23ab2050f6b56dbbc751&logging=false
    subtitle_asset: subtitles/story-2.en.vtt
    objective: 色や形のヒントを探しながら、英語であいさつをしましょう。
    materials: 教材の準備はいりません。
    tip: ヒントが出たら、子どもたちが絵を指さしたり答えたりする時間を取りましょう。
    chapters:
      - start: '00:00:00:00'
        end: '00:01:54:00'
        title: 地図と赤いすべり台
        guide: Jotが地図を見つけます。赤い丸をヒントに、赤いすべり台を探しましょう。Echoに会ったら「Hello!」と手を振りましょう。
      - start: '00:01:54:00'
        end: '00:04:03:00'
        title: 青いブランコと黄色い砂場
        guide: 青い星と黄色い四角をヒントに、ブランコと砂場を探しましょう。BoomやTailに会ったら「Nice to meet you.」と言ってみましょう。
      - start: '00:04:03:00'
        end: '00:05:44:00'
        title: 虹色の輪
        guide: 虹色の輪を見つけたら、動画に合わせて１回ジャンプ、２回足踏み、最後に親指を立てましょう。
      - start: '00:05:44:00'
        end: '00:06:17:00'
        title: お別れのあいさつ
        guide: 帰る時間になったら、友だちに手を振って「See you!」と言いましょう。
      - start: '00:06:17:00'
        title: おさらいクイズ
        guide: 画面に出てくる形やキャラクターの名前を答えましょう。
  basic:
    title: みんなであいさつしよう！
    subtitle_asset: subtitles/basic.en.vtt
    video: https://player.vimeo.com/external/1225143839.m3u8?s=11fe9dcb7779be20830d9059c8f5cbd8ec478453&logging=false
    objective: Hello / Nice to meet you / See you の３つのあいさつを、場面に合わせて使ってみましょう。
    materials: 教材の準備はいりません。立って体を動かせるスペースを確保しましょう。
    tip: 先生が先にお手本を見せてから、子どもたちの返事を待ちましょう。声やジェスチャーで答えられたら、たくさんほめましょう。
    chapters:
      - start: '00:00:00:07'
        end: '00:00:34:00'
        title: オープニング
        guide: Jotが「I'm Jot. Nice to meet you.」と挨拶・自己紹介をします。「お友だちへのあいさつの仕方」を学びます。
      - start: '00:00:34:00'
        end: '00:03:53:00'
        title: 今週のフレーズ、ワードを確認
        guide: |-
          お手本を見てリピートします。
          「Hello」：誰かに会った時の言葉
          「Nice to meet you」：新しいお友だちに会ったときの言葉
          「See you」：別れ際に言う言葉
      - start: '00:03:53:00'
        end: '00:06:15:00'
        title: 単語・表現チェッククイズ
        guide: |-
          2択クイズと記憶ゲームで理解度を確認します。

          シチュエーションクイズ（00:03:49:13 – 00:05:10:15）
          Tailからの2択問題（3問）。
          1. Jotが教室に入ってきたとき（Hello か See you。正解：Hello）
          2. Echoが新しいお友だちに会ったとき（See you か Nice to meet you。正解：Nice to meet you）
          3. Boomがおうちに帰るとき（See you か Hello。正解：See you）

          「だれが消えたかな？」記憶ゲーム（00:05:10:17 – 00:06:21:06）
          消えたキャラクターを当て、場面に合った挨拶をします。Boomが再登場したら「Hello」、Echoが退出したら「See you」が正解です。
      - start: '00:06:15:00'
        end: '00:08:04:00'
        title: 体を動かすアクティビティ
        guide: |-
          立ち上がり、英語フレーズと動きを連動させて定着させます。
          「Hello」手を振る：通常の手振りと全身で「ビッグ・ハロー」。
          「Nice to meet you」エアー握手：手を差し出してやさしく握手。
          「See you」一歩下がってバイバイ：後ろに一歩下がりながら手振り。
      - start: '00:08:04:00'
        end: '00:08:56:00'
        title: ふりかえりクイズ
        guide: |-
          選択肢なしで即座にあいさつを言えるか確認します。
          1. Jotがお友だちに会ったとき「Hello」
          2. Boomに新しいお友だちができたとき「Nice to meet you」
          3. Tailがおうちに帰るとき「See you」
      - start: '00:08:56:00'
        end: '00:09:20:03'
        title: さいごに
        guide: 子どもたちの頑張りを褒めます。「帰る時間の言葉」を問いかけ、全員で手を振り「See you!」で終了します。
  activity-1:
    title: あいさつの工作
    worksheet: worksheets/w1-cut-and-paste.pdf
    subtitle_asset: subtitles/activity-1.en.vtt
    category: 工作
    description: Jot、Echo、Helloのパーツを切って貼り、あいさつの作品を作りましょう。
    video: https://player.vimeo.com/external/1225144025.m3u8?s=60ed890e2bcfe86b6108771b13c05d76388318a0&logging=false
    objective: 工作を通してキャラクターの名前と「Hello」を確認し、声に出してあいさつしましょう。
    materials: ワークシート、はさみ、のりを用意しましょう。
    tip: 貼る場所の確認・切る作業・貼る作業の後に動画が一時停止します。全員の進み具合を確認してから再生しましょう。はさみを使うときは手元を見守ります。
    chapters:
      - start: '00:00:00:07'
        end: '00:00:21:11'
        title: イントロ
        guide: Echoがあいさつをし、これから工作を始めることを伝えています。
      - start: '00:00:20:00'
        end: '00:01:41:20'
        title: 使うものの紹介
        guide: |-
          工作で使うものを確認します。
          ・Scissors / はさみ
          ・Glue / のり
          ・Paper / 紙

          ワークシートに描かれているキャラクター・単語を一緒に確認します。
          ・Jot
          ・Echo
          ・HELLO!
      - start: '00:01:41:22'
        end: '00:02:17:01'
        title: アクティビティの手順 · 貼る場所の確認
        guide: |-
          アクティビティの手順（00:01:41:22 – 00:03:22:10）
          切り取ったパーツをどこに置くかを事前に確認します。
        pause_after: true
      - start: '00:02:17:03'
        end: '00:02:47:00'
        title: 切る作業
        guide: |-
          キャラクターや単語を順番にハサミで切り取ります。
          ・Cut out / 切り抜く
        pause_after: true
      - start: '00:02:47:01'
        end: '00:03:22:10'
        title: 貼る作業
        guide: |-
          のりをつけて1つずつ貼っていきます。
          ・Put glue on ○○ / ○○にのりをつけてね。
          ・Stick ○○ here / ○○をここに貼ってね。
        pause_after: true
      - start: '00:03:22:12'
        end: '00:03:58:12'
        title: おさらい
        guide: クイズ形式で理解度を確認します。キャラクターの名前や「Hello!」を問いかけ、発話を促します。
  activity-2:
    title: なまえをなぞって色ぬり
    worksheet: worksheets/w1-name-trace.pdf
    subtitle_asset: subtitles/activity-2.en.vtt
    category: ぬりえ
    description: 自分の名前をなぞって好きな色でぬり、作品を見せながら自己紹介しましょう。
    video: https://player.vimeo.com/external/1225144026.m3u8?s=19c3f10e7d44865e728639377e81f7a33f5c74e3&logging=false
    # This guide counts up to frame 29.
    timecode_fps: 30
    objective: 自分の名前をなぞって色をぬり、「Hello. I'm [名前].」で自己紹介しましょう。
    materials: 名前のワークシート、えんぴつ、クレヨンを用意しましょう。
    tip: 名前をなぞるときはゆっくり進めましょう。必要に応じて一時停止し、色ぬりや自己紹介の時間を十分につくります。
    chapters:
      - start: '00:00:00:00'
        end: '00:00:20:05'
        title: イントロ
        guide: Jotがあいさつをし、今日のアクティビティでは自分の名前を書く練習をすることを伝えます。「Let's trace.」「Let's color.」と声をかけ、名前をなぞることと色を塗ることを紹介します。
      - start: '00:00:22:29'
        end: '00:01:07:08'
        title: 使うものの紹介
        guide: |-
          アクティビティで使うものと、関連する単語を確認します。
          ・Paper / 紙
          ・Pencil / 鉛筆
          ・Crayons / クレヨン
          ・Name / 名前

          Jotが自分の名前を書いた紙を見せ、名前をなぞる練習を紹介します。
          ・My name / 私の名前
          ・Trace / なぞる
      - start: '00:01:14:27'
        end: '00:03:36:20'
        title: アクティビティの手順
        guide: |-
          自分の名前をなぞる
          Jotがお手本を見せた後、自分の紙と鉛筆を用意します。自分の名前を見つけて指で指し、文字をゆっくりとなぞります。
          ・Take your paper / 紙を持ってね。
          ・Take your pencil / 鉛筆を持ってね。
          ・Find your name / 自分の名前を見つけてね。
          ・Point to your name / 自分の名前を指さしてね。
          ・Trace your name / 自分の名前をなぞってね。
          ・Slowly / ゆっくり。

          名前に色を塗る
          なぞり終わったら、自分の名前に好きな色を塗ります。Jotが色の例を紹介し、自由に好きな色を選ぶよう促します。
          ・Color your name / 自分の名前に色を塗ってね。
          ・Red / 赤
          ・Blue / 青
          ・Yellow / 黄色

          完成
          完成したら、自分の名前を見せて指さします。「Hello, I'm ...」というフレーズを使って、自分の名前を英語で発表する練習をします。
          ・Show your name / 自分の名前を見せてね。
          ・Point to your name / 自分の名前を指さしてね。
          ・Hello, I'm ... / こんにちは、私は〇〇です。
      - start: '00:03:38:00'
        end: '00:04:18:02'
        title: おさらい
        guide: |-
          クイズ形式で、今回のアクティビティで行ったことを振り返ります。

          What is this?（00:03:38:00 – 00:03:50:11）
          自分の名前を指して、何であるかを答えます。答え：My name.

          Did we trace?（00:03:53:08 – 00:04:05:01）
          名前をなぞったかどうかを確認します。答え：Yes. We traced.

          Did we color?（00:04:06:06 – 00:04:18:02）
          名前に色を塗ったかどうかを確認します。答え：Yes. We colored.

          最後に「What do we say?」と問いかけ、「Hello, I'm ...」のフレーズをもう一度練習します。
      - start: '00:04:15:20'
        end: '00:04:19:04'
        title: おわりのあいさつ
        guide: Jotが子どもたちの頑張りを褒め、終了します。
  activity-3:
    title: Helloの点つなぎ
    subtitle_asset: subtitles/activity-3.en.vtt
    category: 脳トレ
    description: １から６までの数字を順につなぎ、Helloの文字を完成させましょう。
    video: https://player.vimeo.com/external/1225144027.m3u8?s=7f8bb660ffbff5cac412806c9c59fe812954df4f&logging=false
    objective: １〜６の数字を数えながら点をつなぎ、「Hello」の文字とあいさつの表現を確認しましょう。
    materials: 点つなぎのワークシート、えんぴつを用意しましょう。
    tip: 数字を順に指さしてから線を引くと取り組みやすくなります。必要に応じて一時停止し、子どもたちのペースに合わせて進めましょう。
    chapters:
      - start: '00:00:00:00'
        end: '00:00:31:00'
        title: イントロ
        guide: Echoがあいさつをし、自分の名前を覚えているか問いかけます。「Hello!」と一緒にあいさつをした後、今回のアクティビティでは「Hello」を書く練習をすることを伝えます。
      - start: '00:00:31:00'
        end: '00:01:14:07'
        title: 使うものの紹介
        guide: |-
          アクティビティで使うものを確認します。
          ・Pencil / 鉛筆
          ・Worksheet / ワークシート

          先生に必要なものをお願いする練習をします。
          ・Pencil, please. / 鉛筆をください。
          ・Worksheet, please. / ワークシートをください。
      - start: '00:01:21:00'
        end: '00:02:12:00'
        title: ワークシートの確認
        guide: |-
          ワークシートに描かれている星や数字を確認します。
          ・Star / 星
          ・Number 1–6 / 数字の1～6
          Echoと一緒に1から6まで数え、数字の順番を確認します。
      - start: '00:02:12:00'
        end: '00:04:21:13'
        title: アクティビティの手順
        guide: |-
          数字をつなぐ練習（00:02:12:00 – 00:02:41:00）
          Echoがお手本を見せながら、数字の1と2、続いて3を見つけて線でつなぎます。
          ・Find number one / 1を見つけてね。
          ・Find number two / 2を見つけてね。
          ・Draw a line / 線を引いてね。

          自分で数字をつなぐ（00:02:41:00 – 00:03:51:22）
          子どもたちが自分でワークシートに取り組みます。1から6までの数字を順番に見つけ、線をつないでいきます。
          ・Now it's your turn / 今度はみんなの番だよ。
          ・Find one / 1を見つけてね。
          ・Find two / 2を見つけてね。
          ・Number three / 3だよ。
          ・Number four / 4だよ。
          ・Number five / 5だよ。
          ・Number six / 6だよ。

          完成した単語の確認（00:03:51:23 – 00:04:05:05）
          Echoと一緒に1から6まで数えます。線をつなぐと「HELLO」という単語が完成することを確認し、みんなで「Hello!」と発音します。
          ・Let's count together / 一緒に数えよう。
      - start: '00:04:05:05'
        end: '00:05:43:00'
        title: 英語表現の練習とおさらい
        guide: |-
          完成した「HELLO」を使って、3つのあいさつ表現を練習します。Echoの後に続いて、みんなで発音します。
          ・Hello. / こんにちは。
          ・Nice to meet you. / はじめまして。
          ・See you. / またね。
          最後に3つの表現をもう一度順番に練習します。

          数字の確認（00:05:21:08 – 00:05:30:25）
          1から6まで順番に数えます。

          単語の確認（00:05:31:12 – 00:05:43:00）
          「What is this?」と問いかけ、完成した単語を答えます。答え：Hello!
      - start: '00:05:43:00'
        end: '00:05:51:20'
        title: おわりのあいさつ
        guide: Echoが子どもたちの頑張りを褒め、今日のアクティビティを終了します。「Bye bye! See you!」とあいさつをして終わります。
